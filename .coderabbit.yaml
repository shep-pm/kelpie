# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# Every key here departs from a default, so an absent key means the default is
# right. CodeRabbit's free plan reviews public repositories only, so
# this file does nothing until the repository goes public.
language: en-US
tone_instructions: >-
  Be direct and specific. Prose in this repo is hand-written in a deliberate
  voice: flag factual drift, never style or wording. Do not repeat lints that
  CI already enforces as a required check.
reviews:
  profile: assertive
  auto_review:
    # Off, and a pull request opts in with the marker below in its
    # description, so a drive-by pull request from a fork does not spend the
    # plan's review slot. `@coderabbitai review` works on any pull request.
    enabled: false
    description_keyword: "<!-- coderabbit-review -->"
  path_filters:
    - "!**/CHANGELOG.md"
  path_instructions:
    - path: "**/*.md"
      instructions: >-
        Prose here is hand-written in a deliberate voice. Do not suggest
        rewording, tightening, or rewrapping. Flag only factual drift: a claim
        about behaviour the diff makes false, a command that no longer exists,
        a sample that will not parse.
        Terminology follows shep's docs/terminology.md, which is not in this
        repository. A `sheep` is one managed process and the word is singular
        only; the plural is `flock`, never "sheeps" and never bare "sheep".
        `dogs` are plugin processes, and the daemon is only ever "the
        shepherd".
    - path: ".github/workflows/**"
      instructions: >-
        Every job needs `timeout-minutes`; GitHub's default is 360.
  tools:
    clippy:
      enabled: false
    eslint:
      enabled: false
    biome:
      enabled: false
    oxc:
      enabled: false
    stylelint:
      enabled: false
    languagetool:
      enabled: false
    markdownlint:
      enabled: false
  assess_linked_issues: false
  related_issues: false
  suggested_labels: false
  suggested_reviewers: false
knowledge_base:
  code_guidelines:
    filePatterns:
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
