[package]
name = "kelpie-app"
description = "Kelpie's window: the Tauri 2 app crate that hosts the engine and its IPC"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
tauri.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
# `test` for `tauri::test`'s mock runtime, so the app can be built with no webview
tauri = { workspace = true, features = ["test"] }
