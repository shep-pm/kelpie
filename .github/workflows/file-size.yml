name: file size
# The mechanical half of IR-48: no `.rs` file over 1000 lines.
#
# The job is copied from shep-pm/rust-house-style's
# `.github/workflows/file-size.yml@v0.1.0`, a reusable workflow, with a
# `merge_group` trigger added for the merge queue. Re-copy it when that
# workflow changes, rather than editing this one into something new.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  file-size:
    name: 1000-line cap on .rs files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The reusable workflow's inputs, as their defaults. `.github/rust-file-size-baseline.txt`
      # is the known-offenders list; it is absent here, which the check reads as empty.
      # The check is `scripts/file-size.py`, which `scripts/check.sh` runs too.
      - name: Check file sizes
        env:
          EXCLUDE: ""
          BASELINE: .github/rust-file-size-baseline.txt
          RATCHET: false
        run: python3 -I scripts/file-size.py
