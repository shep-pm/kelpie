name: test
# The Rust gates, on GitHub's hosted runners. Only main saves the cache: a pull
# request and a merge queue group read main's build, and the repo holds one
# cache per job.
#
# Every job carries `timeout-minutes`, a ceiling against a hang rather than a
# performance budget. GitHub's default when absent is 360. The Rust jobs compile
# `src-tauri`, so each installs the Linux packages Tauri links against, and each
# has room for a cold build of the Tauri tree.
#
# The `app` job is the one that runs `tauri build`, which is what makes a release
# binary: a plain `cargo build --release` leaves `custom-protocol` off and the
# binary loads `devUrl`.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Linux packages Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `src-tauri/build.rs` copies the reaper sidecar next to the app binary and
      # stops when the file is missing, so every job that builds src-tauri builds
      # it first. The profile does not matter to a copy.
      - run: scripts/build-reaper.sh --debug
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The sandbox tests run a real command inside crabpot, which on Linux is
  # bubblewrap. GitHub's Ubuntu 24.04 image ships with
  # `kernel.apparmor_restrict_unprivileged_userns=1`, which gives bwrap's user
  # namespace no capabilities, so the job turns it off first. The VM is thrown
  # away after the job, and the tests run as the image's own user, not root.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the packages the build and the sandbox need
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev bubblewrap
      - name: Let an unprivileged user namespace keep its capabilities
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The reaper sidecar, which `src-tauri/build.rs` needs before anything in
      # src-tauri compiles. See the `lint` job.
      - run: scripts/build-reaper.sh --debug
      # What the sandbox tests depend on, printed so a red run says why. It
      # fails nothing.
      - name: Say what this host does about user namespaces
        run: |
          uname -sr
          for sysctl in kernel/apparmor_restrict_unprivileged_userns kernel/unprivileged_userns_clone user/max_user_namespaces; do
            echo "$sysctl: $(cat /proc/sys/$sysctl 2>&1)"
          done
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all true && echo "bwrap --unshare-all: ok" || echo "bwrap --unshare-all: failed"
      - run: cargo test --workspace --locked

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Linux packages Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The reaper sidecar, which `src-tauri/build.rs` needs before anything in
      # src-tauri compiles. See the `lint` job.
      - run: scripts/build-reaper.sh --debug
      - run: cargo doc --workspace --no-deps --locked

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Linux packages Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # Matches `rust-version` in Cargo.toml: specta's, above Tauri 2's 1.90 (ADR 0002).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.93
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The reaper sidecar, which `src-tauri/build.rs` needs before anything in
      # src-tauri compiles. See the `lint` job.
      - run: scripts/build-reaper.sh --debug
      - run: cargo +1.93 check --workspace --all-targets --locked

  app:
    name: app
    # `tauri build` compiles the whole Tauri tree in release and links
    # WebKitGTK.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm before setup-node, as in web.yml: setup-node's pnpm cache hashes
      # the lockfile through the pnpm version `packageManager` pins.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the Linux packages Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      # The sidecar `bundle.externalBin` names, at the profile `tauri build`
      # builds at. `build.beforeBuildCommand` runs the same script, so this is
      # the file in place before the job asks for it rather than extra work.
      - run: scripts/build-reaper.sh --release
      # `--no-bundle` builds the binary and skips deb/rpm/AppImage packaging,
      # which needs the bundler's own toolchain and is not a gate here.
      - run: pnpm tauri build --no-bundle
