name: test
# The Rust gates, on the maintainer's runner pool. The pool image has no Rust,
# so every job installs its own toolchain. Only main saves the cache: a pull
# request reads main's build, and the repo holds one cache per job.
#
# Every job carries `timeout-minutes`, a ceiling against a hang rather than a
# performance budget. GitHub's default when absent is 360. The Rust jobs compile
# `src-tauri`, so each installs the Linux packages Tauri links against, and each
# has room for a cold build of the Tauri tree.
#
# The `app` job is the one that runs `tauri build`, which is what makes a release
# binary: a plain `cargo build --release` leaves `custom-protocol` off and the
# binary loads `devUrl`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    name: fmt and clippy
    runs-on: [self-hosted]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Linux packages Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `src-tauri/build.rs` copies the reaper sidecar next to the app binary and
      # stops when the file is missing, so every job that builds src-tauri builds
      # it first. The profile does not matter to a copy.
      - run: scripts/build-reaper.sh --debug
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The sandbox tests run a real command inside crabpot, which on Linux is
  # bubblewrap: it needs a user namespace, a mount of its own and a fresh
  # `/proc`. Docker's defaults refuse all three, so this one job runs in a
  # container with each of them lifted, as a user that is not root. Nothing is
  # changed on the host or in the runner image. The rest of the jobs stay as
  # they were.
  #
  # The three options are each load-bearing, tested with `bwrap --ro-bind / /
  # --dev /dev --proc /proc --unshare-all true` as a non-root user: seccomp
  # refuses the namespace, AppArmor refuses the mounts, and Docker's masked
  # `/proc` refuses a fresh proc mount.
  test:
    # ARM64 only: those hosts are Ubuntu 22.04, and the x86 one is 24.04, whose AppArmor gives bwrap's user namespace no capabilities
    runs-on: [self-hosted, ARM64]
    # No rust-cache here: it keys on the user that runs it, and the build is
    # the user's, not root's. So the build is cold, which the ceiling allows for.
    timeout-minutes: 45
    container:
      image: ubuntu:22.04
      options: >-
        --security-opt seccomp=unconfined
        --security-opt apparmor=unconfined
        --security-opt systempaths=unconfined
    env:
      CARGO_TERM_COLOR: always
      DEBIAN_FRONTEND: noninteractive
    steps:
      # The image is bare and the step runs as root, so no `sudo`
      - name: Install the packages the build and the sandbox need
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl wget file git build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev bubblewrap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make the user the tests run as
        run: |
          useradd --create-home kelpie
          chown -R kelpie "$GITHUB_WORKSPACE"
      - name: Install the toolchain as that user
        run: |
          runuser -u kelpie -- env HOME=/home/kelpie sh -c 'curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable'
      # The reaper sidecar, which `src-tauri/build.rs` needs before anything in
      # src-tauri compiles. See the `lint` job.
      - name: Build the reaper sidecar as that user
        run: |
          runuser -u kelpie -- env HOME=/home/kelpie PATH=/home/kelpie/.cargo/bin:"$PATH" scripts/build-reaper.sh --debug
      # What the sandbox tests depend on and the job's options cannot change,
      # printed so a red run says which host it ran on and why. It fails nothing.
      - name: Say what this host does about user namespaces
        run: |
          echo "runner: ${RUNNER_NAME:-unknown}"
          uname -sr
          for sysctl in kernel/apparmor_restrict_unprivileged_userns kernel/unprivileged_userns_clone user/max_user_namespaces; do
            echo "$sysctl: $(cat /proc/sys/$sysctl 2>&1)"
          done
          runuser -u kelpie -- bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all true && echo "bwrap --unshare-all: ok" || echo "bwrap --unshare-all: failed"
      - name: Test as that user
        run: |
          runuser -u kelpie -- env HOME=/home/kelpie PATH=/home/kelpie/.cargo/bin:"$PATH" CARGO_TERM_COLOR=always cargo test --workspace --locked

  docs:
    runs-on: [self-hosted]
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Linux packages Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The reaper sidecar, which `src-tauri/build.rs` needs before anything in
      # src-tauri compiles. See the `lint` job.
      - run: scripts/build-reaper.sh --debug
      - run: cargo doc --workspace --no-deps --locked

  msrv:
    runs-on: [self-hosted]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Linux packages Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # Matches `rust-version` in Cargo.toml: specta's, above Tauri 2's 1.90 (ADR 0002).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.93
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The reaper sidecar, which `src-tauri/build.rs` needs before anything in
      # src-tauri compiles. See the `lint` job.
      - run: scripts/build-reaper.sh --debug
      - run: cargo +1.93 check --workspace --all-targets --locked

  app:
    name: app
    # `tauri build` compiles the whole Tauri tree in release and links
    # WebKitGTK. Pinned to the x86 box: the pool's arm64 boxes do it far slower.
    runs-on: [self-hosted, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm before setup-node, as in web.yml: setup-node's pnpm cache hashes
      # the lockfile through the pnpm version `packageManager` pins.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the Linux packages Tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      # The sidecar `bundle.externalBin` names, at the profile `tauri build`
      # builds at. `build.beforeBuildCommand` runs the same script, so this is
      # the file in place before the job asks for it rather than extra work.
      - run: scripts/build-reaper.sh --release
      # `--no-bundle` builds the binary and skips deb/rpm/AppImage packaging,
      # which needs the bundler's own toolchain and is not a gate here.
      - run: pnpm tauri build --no-bundle
