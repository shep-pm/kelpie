[package]
name = "kelpie-protocol"
description = "The types the engine and the app share: a session's harness-neutral events"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Option: `specta::Type` on every type, for the app's generated TypeScript
# bindings. The app crate turns it on; the engine does not.
specta = ["dep:specta"]

[dependencies]
serde.workspace = true
specta = { workspace = true, optional = true }

[dev-dependencies]
# Only to test the wire form
serde_json.workspace = true
