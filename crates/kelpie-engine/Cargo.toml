[package]
name = "kelpie-engine"
description = "The part of kelpie that starts, watches and stops every process, and holds the sessions"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
shep-tree.workspace = true
sysinfo.workspace = true

# The bridge installer: download, sha256 and the two archive formats (ADR 0007)
ureq.workspace = true
sha2.workspace = true
flate2.workspace = true
tar.workspace = true
zip.workspace = true

# The tests answer their own downloads instead of opening a socket, which the
# sandbox kelpie workers run in refuses. See `src/bridge/tests.rs`.
[dev-dependencies]
ureq = { workspace = true, features = ["_test"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true
