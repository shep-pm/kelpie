[package]
name = "kelpie-engine"
description = "The part of kelpie that starts, watches and stops every process, and holds the sessions"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Option: `session::fake`, a scripted ACP agent that runs in-process, for tests
# of the engine and of whatever holds a session. The engine's own tests have it
# without the feature.
testing = []

[dependencies]
agent-client-protocol.workspace = true
blocking.workspace = true
crabpot.workspace = true
futures.workspace = true
getrandom.workspace = true
jiff.workspace = true
keyring.workspace = true
kelpie-protocol.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
schemars.workspace = true
rmcp.workspace = true
shep-tree.workspace = true
sysinfo.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# The worktree reads made in this process instead of starting git
gix.workspace = true

# The bridge installer: download, sha256 and the two archive formats (ADR 0007)
ureq.workspace = true
semver.workspace = true
sha2.workspace = true
flate2.workspace = true
tar.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# These run a real command inside crabpot. On Linux crabpot runs the test's own
# binary again as its helper, which libtest's `main` would refuse, so the test
# is its own `main`: it calls `sandbox::run_from_args` first, as the app does.
[[test]]
name = "sandbox"
path = "tests/sandbox.rs"
harness = false

[dev-dependencies]
# The parity check reads `docs/parity.toml`
toml.workspace = true
# The folders `worker_folder`'s tests build
tempfile.workspace = true
