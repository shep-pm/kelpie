[workspace]
members = ["crates/*", "src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
# 1.93 is specta's: its `fmt::from_fn` is stable from there, and tauri-specta
# (`.claude/skills/tauri`, choice 8) needs it. Tauri's own MSRV is 1.90.
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shep-pm/kelpie"

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
self_named_module_files = "deny"

[workspace.dependencies]
# The system's random bytes, on Unix and Windows alike
getrandom = { version = "0.4", default-features = false, features = ["std"] }

# The run file's JSON, written and read by the engine
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
# The settings schema, written from the Rust types (docs/design/settings.md).
# `derive` is the `JsonSchema` derive; `std` is off because no schema type here
# is a std one.
schemars = { version = "1.2.3", default-features = false, features = ["derive"] }
# An agent file's YAML frontmatter, read into typed keys that refuse an unknown
# one by name (`docs/design/settings.md`, Agent files). SK's choice, lifted with
# the loader.
serde-saphyr = { version = "1", default-features = false, features = ["deserialize"] }
# The ACP client (ADR 0007). `unstable_end_turn_token_usage` is the per-turn
# token counts on a prompt's response; `process` stays off, since every process
# goes through the engine's tree (ADR 0001).
agent-client-protocol = { version = "5.1", default-features = false, features = ["unstable_end_turn_token_usage"] }
# The channels, executor and I/O traits the ACP client is built on. The engine
# drives each connection on a thread of its own, so it needs `executor`.
futures = { version = "0.3.32", default-features = false, features = ["std", "async-await", "executor"] }
# A child's blocking pipes as the async streams ACP reads and writes, without a
# runtime
blocking = { version = "1.6", default-features = false }
# The types the engine and the app share
kelpie-protocol = { path = "crates/kelpie-protocol" }
# The sessions, the process tree and the bridges, which the app hosts (ADR 0002)
kelpie-engine = { path = "crates/kelpie-engine" }
# Own process group per child, stop ladder and the sweep (ADR 0001). `sysinfo`
# is the process table the sweep reads.
shep-tree = { version = "0.25.0", default-features = false, features = ["sysinfo"] }
# The process table the engine reads each process's environment from; the
# version shep-tree uses, so the build holds one copy.
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
# Each session's sandbox (ADR 0005). crabpot runs the host binary again as its
# helper on Linux and Windows, so the app calls `run_from_args` first. `cli` is
# the `crabpot` command, which kelpie does not install.
crabpot = { version = "0.10.8", default-features = false }

# Reads `docs/parity.toml` in the engine's tests (the harness parity matrix)
toml = { version = "1.2", default-features = false, features = ["std", "parse", "serde"] }
# Unix: the child-subreaper flag (Linux), and `openat` without following a link
# in `worker_folder`
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process"] }
# The engine's tests that need a folder of their own
tempfile = { version = "3", default-features = false }

# The bridge installer's download (ADR 0007): a blocking client over rustls, so
# no downloader process enters the tree (ADR 0001). `rustls` alone drops gzip,
# cookies, json and brotli, which kelpie does not use here.
ureq = { version = "3.1.2", default-features = false, features = ["rustls"] }
# The sha256 the registry publishes for each bridge archive, checked before unpacking
sha2 = { version = "0.10.9", default-features = false }
# A bridge's version, to tell which of two is newer; `serde` writes it into `versions.json`
semver = { version = "1.0.28", default-features = false, features = ["std", "serde"] }
# The registry ships bridges as `.tar.gz` on Linux and `.zip` on macOS (ADR 0007).
# `rust_backend` keeps the C zlib out of the build.
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4.45", default-features = false }
# `deflate` only: the registry's archives are stored or deflated
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

# Reads a ref, an ancestry and a tree in a repo without starting git, which costs
# tens of milliseconds on Windows. Reads only: no network, no writes. `sha1` is
# the one hash gix builds, so a sha256 repo is left to git.
gix = { version = "0.90", default-features = false, features = ["revision", "sha1"] }

# The OS keychain a harness's login lives in (`docs/design/settings.md`). `v1` is
# the crate's own pick of the native store per OS: Keychain Services on macOS,
# Credential Manager on Windows, the Secret Service over pure-Rust zbus on Linux.
keyring = { version = "4.2", default-features = false, features = ["v1"] }

# Tauri 2 with the Wry webview (ADR 0002). `x11` and `dbus` are the Linux window
# and menu plumbing; default-features drops `dynamic-acl` and `common-controls-v6`,
# which kelpie has no capability or menu to use yet.
tauri = { version = "2.12.5", default-features = false, features = [
  "wry",
  "compression",
  "x11",
  "dbus",
] }
# The config, ACL and asset codegen behind `generate_context!`
tauri-build = { version = "2.7.4", default-features = false, features = ["config-json"] }
# Typed commands and their TypeScript bindings (`.claude/skills/tauri`, choice 8).
# tauri-specta is still a release candidate, so it and the `specta` it requires
# are pinned exact; `specta-typescript` is the version rc.26 names.
tauri-specta = { version = "=2.0.0-rc.26", default-features = false, features = ["typescript"] }
specta = { version = "=2.0.0-rc.26", default-features = false, features = ["std", "derive", "serde_json"] }
specta-typescript = { version = "0.0.13", default-features = false }
# The folder picker (`project_pick`). Its default `gtk3` is the Linux backend.
tauri-plugin-dialog = "2.8.4"
# The Win32 bindings `src-tauri/src/sys.rs` calls one message box through
windows = { version = "0.62.2", default-features = false, features = [
  "std",
  "Win32_UI_WindowsAndMessaging",
] }

# Debug info dominates a debug build, and dependencies never need theirs.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
