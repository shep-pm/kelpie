[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shep-pm/kelpie"

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
self_named_module_files = "deny"

[workspace.dependencies]
# The system's random bytes, on Unix and Windows alike
getrandom = { version = "0.4", default-features = false, features = ["std"] }

# Debug info dominates a debug build, and dependencies never need theirs.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
