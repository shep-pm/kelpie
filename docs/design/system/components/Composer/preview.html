<!-- @dsCard group="Chat" height=270 subtitle="The message box, idle and while a turn runs" -->
<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script>
<meta charset="utf-8"><title>Composer</title>
<style>html,body{margin:0} body{background:var(--background)}</style>
</head>
<body class="k">

<div class="k-pad k-col" style="gap:16px;max-width:520px;background:var(--sidebar)">
  <div class="k-composer">
    <div class="text ph">Message the PM</div>
    <div class="bar"><span class="k-chip"><svg class="k-i-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2" /> <path d="M17 3h2a2 2 0 0 1 2 2v2" /> <path d="M21 17v2a2 2 0 0 1-2 2h-2" /> <path d="M7 21H5a2 2 0 0 1-2-2v-2" /></svg><b>3 nodes</b> from the graph</span><span class="k-grow"></span>
      <span class="k-cap k-muted">Claude Code · Opus 5.5</span><button class="k-btn k-btn--icon k-btn--sm" aria-label="Send"><svg class="k-i-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7" /> <path d="M12 19V5" /></svg></button></div>
  </div>
  <div class="k-col" style="gap:6px">
    <div class="k-running-line" data-s="running"><svg class="k-glyph" data-s="running" viewBox="0 0 12 12" aria-hidden="true"><circle class="track" cx="6" cy="6" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path class="k-spin" d="M6 1.75a4.25 4.25 0 0 1 4.25 4.25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Working · 40s · step 6</div>
    <div class="k-composer">
      <div class="text">Keep the old reaper tests, just move them.</div>
      <div class="bar"><span class="k-cap k-muted">Enter sends a note, read at the PM's next step</span><span class="k-grow"></span>
        <button class="k-btn k-btn--sm k-btn--destructive-outline"><svg class="k-i-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" /></svg>Stop and tell</button>
        <button class="k-btn k-btn--sm"><svg class="k-i-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z" /> <path d="M15 3v4a2 2 0 0 0 2 2h4" /></svg>Note</button></div>
    </div>
  </div>
</div>
</body>
</html>
