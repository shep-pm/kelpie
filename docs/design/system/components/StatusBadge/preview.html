<!-- @dsCard group="Status" height=200 subtitle="Six states, each a word, a glyph and a colour" -->
<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script>
<meta charset="utf-8"><title>StatusBadge</title>
<style>html,body{margin:0} body{background:var(--background)}</style>
</head>
<body class="k">

<div class="k-pad k-col" style="gap:16px">
  <div class="k-col" style="gap:6px"><span class="k-label">Badge · soft fill</span><div class="k-row" style="gap:8px"><span class="k-badge " data-s="idle"><svg class="k-glyph" data-s="idle" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Idle</span><span class="k-badge " data-s="running"><svg class="k-glyph" data-s="running" viewBox="0 0 12 12" aria-hidden="true"><circle class="track" cx="6" cy="6" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path class="k-spin" d="M6 1.75a4.25 4.25 0 0 1 4.25 4.25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Running</span><span class="k-badge " data-s="needs"><svg class="k-glyph" data-s="needs" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.2 10.8 6 6 10.8 1.2 6Z" fill="currentColor"/></svg>Needs you</span><span class="k-badge " data-s="blocked"><svg class="k-glyph" data-s="blocked" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.6 6h4.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Blocked</span><span class="k-badge " data-s="done"><svg class="k-glyph" data-s="done" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.4 6.3 4.9 8.7 9.6 3.6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>Done</span><span class="k-badge " data-s="failed"><svg class="k-glyph" data-s="failed" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3 3 9" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>Failed</span></div></div>
  <div class="k-col" style="gap:6px"><span class="k-label">Inline · glyph and word, for rows and node sublabels</span><div class="k-row" style="gap:16px"><span class="k-row" style="gap:6px"><svg class="k-glyph" data-s="idle" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span style="color:var(--s-fg)" data-s="idle" class="k-cap">Idle</span></span><span class="k-row" style="gap:6px"><svg class="k-glyph" data-s="running" viewBox="0 0 12 12" aria-hidden="true"><circle class="track" cx="6" cy="6" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path class="k-spin" d="M6 1.75a4.25 4.25 0 0 1 4.25 4.25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span style="color:var(--s-fg)" data-s="running" class="k-cap">Running</span></span><span class="k-row" style="gap:6px"><svg class="k-glyph" data-s="needs" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.2 10.8 6 6 10.8 1.2 6Z" fill="currentColor"/></svg><span style="color:var(--s-fg)" data-s="needs" class="k-cap">Needs you</span></span><span class="k-row" style="gap:6px"><svg class="k-glyph" data-s="blocked" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.6 6h4.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span style="color:var(--s-fg)" data-s="blocked" class="k-cap">Blocked</span></span><span class="k-row" style="gap:6px"><svg class="k-glyph" data-s="done" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.4 6.3 4.9 8.7 9.6 3.6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg><span style="color:var(--s-fg)" data-s="done" class="k-cap">Done</span></span><span class="k-row" style="gap:6px"><svg class="k-glyph" data-s="failed" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3 3 9" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span style="color:var(--s-fg)" data-s="failed" class="k-cap">Failed</span></span></div></div>
  <div class="k-col" style="gap:6px"><span class="k-label">Dot · only beside a name that already says what it is</span><div class="k-row" style="gap:16px"><span class="k-row" style="gap:6px"><span class="k-dot" data-s="idle"></span><span class="k-cap k-muted">Idle</span></span><span class="k-row" style="gap:6px"><span class="k-dot" data-s="running"></span><span class="k-cap k-muted">Running</span></span><span class="k-row" style="gap:6px"><span class="k-dot" data-s="needs"></span><span class="k-cap k-muted">Needs you</span></span><span class="k-row" style="gap:6px"><span class="k-dot" data-s="blocked"></span><span class="k-cap k-muted">Blocked</span></span><span class="k-row" style="gap:6px"><span class="k-dot" data-s="done"></span><span class="k-cap k-muted">Done</span></span><span class="k-row" style="gap:6px"><span class="k-dot" data-s="failed"></span><span class="k-cap k-muted">Failed</span></span></div></div>
</div>
</body>
</html>
