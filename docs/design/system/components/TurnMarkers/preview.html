<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script>
<meta charset="utf-8"><title>TurnMarkers</title>
<style>html,body{margin:0} body{background:var(--background)}</style>
</head>
<body class="k">

<div class="k-pad k-col" style="gap:16px;max-width:560px;background:var(--sidebar)">
  <div class="k-col" style="gap:6px">
    <div class="k-msg-user" style="font-size:14px;line-height:22px">Split the reaper out of the engine crate.</div>
    <div class="k-row" style="justify-content:flex-end;gap:8px"><span class="k-interrupted" data-s="failed"><svg class="k-glyph" data-s="failed" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3 3 9" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>Interrupted when kelpie quit</span><button class="k-btn k-btn--sm k-btn--outline"><svg class="k-i-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /> <path d="M3 3v5h5" /></svg>Retry</button></div>
  </div>
  <div class="k-divider"><span><svg class="k-i-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="18" r="3" /> <circle cx="6" cy="6" r="3" /> <path d="M13 6h3a2 2 0 0 1 2 2v7" /> <line x1="6" x2="6" y1="9" y2="21" /></svg>Switched from Claude Code (Opus 5.5) to goose (qwen)</span></div>
  <div class="k-divider"><span><svg class="k-i-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /> <path d="M3 3v5h5" /></svg>Couldn't resume, started a new session</span></div>
  <div class="k-divider"><span>Yesterday</span></div>
</div>
</body>
</html>
